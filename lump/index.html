<style>
  /* Layout: full-bleed studio with the clay in the middle; title bottom-left, one soft toolbar bottom-centre, a short how-to top-right. */
  :root{
    --wall:#e9e1d6;
    --wall2:#c9bcad;
    --ink:#3a2f29;
    --soft:#6d5f55;
    --chip:#fbf7f1;
    --line:#3a2f2926;
    --hot:#c8643c;
    --grot:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:radial-gradient(120% 90% at 50% 38%,var(--wall) 0%,#ddd2c5 55%,var(--wall2) 100%)}
  body{font-family:var(--grot);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:none}
  #ring{position:fixed;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:1.5px solid #3a2f2999;pointer-events:none;z-index:4;opacity:0;transition:opacity .2s,border-color .2s,background-color .2s;transform:translate(-999px,-999px)}
  #ring::after{content:"";position:absolute;inset:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#3a2f29b3}
  #ring.on{opacity:1}
  #ring.off-clay{border-style:dashed;border-color:#3a2f2959}
  #ring.grab{border-color:var(--hot);background:#c8643c1f}
  #ring .arm{position:absolute;inset:-1.5px;border-radius:50%;border:2.5px solid var(--hot);clip-path:inset(0 0 100% 0);opacity:.9}

  header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px max(28px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));pointer-events:none}
  header a{pointer-events:auto;font-size:14px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
  .how{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--soft);text-align:right}
  .how b{font-weight:500;color:var(--ink)}

  .title{position:fixed;left:max(28px,env(safe-area-inset-left,0px));bottom:max(26px,env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}

  .bar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);background:#fbf7f1d9;border:1px solid var(--line);border-radius:999px;padding:7px 10px;box-shadow:0 10px 30px -18px #3a2f2980;backdrop-filter:blur(10px)}

    .bar button{padding:7px 9px;font-size:12px}

<body>
<canvas id="c" aria-label="A ball of clay. Drag on it to press it in, press and hold then drag to pull it out, drag around it to turn it."></canvas>
<div id="ring" aria-hidden="true"><div class="arm"></div></div>

<header>
  <a href="../">&larr; VisualStims</a>
  <ul class="how">
    <li><b>drag</b> on the clay to press it in</li>
    <li><b>hold</b>, then drag, to pull it out</li>
    <li><b>drag around it</b> to turn it · scroll to zoom</li>
  </ul>
</header>

<div class="title">
  <h1><span class="script">Lump</span><span class="sub">a ball of clay, for your hands</span></h1>
</div>

<nav class="bar" aria-label="Clay tools">
  <button id="tSmooth" aria-pressed="false" title="Drag on the clay to smooth it">smooth</button>
  <button id="tWheel" aria-pressed="false" title="Spin it like a pottery wheel">wheel</button>
  <span class="sep"></span>
  <label class="size">finger <input id="size" type="range" min="0.12" max="0.6" step="0.01" value="0.3" aria-label="Finger size"></label>
  <span class="sep"></span>
  <div class="sw" id="sw" role="group" aria-label="Clay colour"></div>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl/Cmd+Z)">undo</button>
  <button id="fresh" title="Start again with a fresh lump">new lump</button>
  <button id="snd" aria-pressed="true" title="Squishy sounds">sound</button>
</nav>

<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const THUMB = new URLSearchParams(location.search).has('thumb');
if (THUMB) document.body.classList.add('thumb');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;

/* ---------- renderer, studio, light ---------- */
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:THUMB});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, .1, 60);
let camDist = 6.2;
const key = new THREE.DirectionalLight(0xfff0e0, 2.1); key.position.set(1.6, 5, 2.4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, {left:-2.6, right:2.6, top:2.6, bottom:-2.6, near:.5, far:14}); key.shadow.radius = 14; key.shadow.blurSamples = 20; key.shadow.bias = -.0006;
const fill = new THREE.DirectionalLight(0xe8eeff, .55); fill.position.set(-3, 1, 2.5);
const bounce = new THREE.DirectionalLight(0xffe2cc, .45); bounce.position.set(0, -3, 1.5);
scene.add(key, fill, bounce, new THREE.HemisphereLight(0xfff8f0, 0xb39684, .9));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({opacity:.12}));
ground.rotation.x = -Math.PI/2; ground.position.y = -1.04; ground.receiveShadow = true; scene.add(ground);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camDist = Math.max(camDist, w < h ? 8 : 6.2);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- the lump ---------- */
const DETAIL = COARSE ? 38 : 50;
let geo = new THREE.IcosahedronGeometry(1, DETAIL);
geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
geo = mergeVertices(geo, 1e-6);
const pos = geo.attributes.position, P = pos.array, NV = pos.count;
// a slightly hand-rolled ball, not a perfect sphere
for (let i = 0; i < NV; i++){
  const x = P[3*i], y = P[3*i+1], z = P[3*i+2];
  const k = 1 + .022*Math.sin(x*3.1 + 1.2)*Math.sin(y*2.7 + .4) + .014*Math.sin(z*4.3 + x*1.7);
  P[3*i] *= k; P[3*i+1] *= k*.97; P[3*i+2] *= k;
}
const START = Float32Array.from(P);
geo.setAttribute('aRest', new THREE.BufferAttribute(Float32Array.from(P), 3));
geo.computeVertexNormals();

// neighbours, for smoothing
const idx = geo.index.array, nbStart = new Int32Array(NV + 1), tmpSets = Array.from({length:NV}, () => new Set());
for (let f = 0; f < idx.length; f += 3){ const a = idx[f], b = idx[f+1], c = idx[f+2]; tmpSets[a].add(b).add(c); tmpSets[b].add(a).add(c); tmpSets[c].add(a).add(b); }
let tot = 0; for (let i = 0; i < NV; i++){ nbStart[i] = tot; tot += tmpSets[i].size; } nbStart[NV] = tot;
const nb = new Int32Array(tot); for (let i = 0; i < NV; i++){ let k = nbStart[i]; for (const j of tmpSets[i]) nb[k++] = j; }

const COLORS = [
  ['terracotta', '#c2673f', '#e59a77'], ['porcelain', '#ece6dc', '#ffffff'], ['slate', '#7d8590', '#aab3bd'],
  ['sage', '#97a987', '#c4d3b5'], ['ochre', '#d1a043', '#efd08a'], ['blush', '#dfa2a0', '#f5cfcc'], ['ink', '#38476b', '#7484ad']
];
const mat = new THREE.MeshPhysicalMaterial({color:COLORS[0][1], roughness:.82, metalness:0, sheen:.55, sheenRoughness:.75, sheenColor:new THREE.Color(COLORS[0][2])});
mat.onBeforeCompile = sh => {
  sh.vertexShader = 'attribute vec3 aRest;\nvarying vec3 vRest;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = aRest;');
  sh.fragmentShader = 'varying vec3 vRest;\nfloat h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7)))*43758.5453); }\nfloat vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);\n  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y), mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }\n'
    + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n  float blot = vn(vRest*3.5)*.6 + vn(vRest*9.)*.4;\n  float grit = h3(floor(vRest*260.));\n  diffuseColor.rgb *= .93 + .1*blot;\n  diffuseColor.rgb *= grit > .985 ? .78 : (.985 + .03*grit);');
};
const lump = new THREE.Mesh(geo, mat); lump.castShadow = true; lump.receiveShadow = true;
scene.add(lump);
let targetCol = new THREE.Color(COLORS[0][1]), targetSheen = new THREE.Color(COLORS[0][2]);

/* ---------- sculpting ---------- */
let brush = .3, dirty = false;
const tmpV = new THREE.Vector3(), inv = new THREE.Quaternion();
const falloff = (d2, r2) => { const t = 1 - d2/r2; return t*t; };

function press(h, n, s){                       // push clay in along the surface normal
  const r = brush, r2 = r*r;
  for (let i = 0; i < NV; i++){
    const dx = P[3*i] - h.x, dy = P[3*i+1] - h.y, dz = P[3*i+2] - h.z, d2 = dx*dx + dy*dy + dz*dz;
    if (d2 >= r2) continue;
    const f = falloff(d2, r2)*s;
    P[3*i] -= n.x*f; P[3*i+1] -= n.y*f; P[3*i+2] -= n.z*f;
  }
  relax(h, r*1.1, .22);
  dirty = true;
}
function relax(h, r, k){                       // laplacian smoothing inside a radius
  const r2 = r*r;
  for (let i = 0; i < NV; i++){
    const dx = P[3*i] - h.x, dy = P[3*i+1] - h.y, dz = P[3*i+2] - h.z, d2 = dx*dx + dy*dy + dz*dz;
    if (d2 >= r2) continue;
    let ax = 0, ay = 0, az = 0; const a = nbStart[i], b = nbStart[i+1];
    for (let q = a; q < b; q++){ const j = nb[q]; ax += P[3*j]; ay += P[3*j+1]; az += P[3*j+2]; }
    const m = b - a, f = falloff(d2, r2)*k;
    P[3*i] += (ax/m - P[3*i])*f; P[3*i+1] += (ay/m - P[3*i+1])*f; P[3*i+2] += (az/m - P[3*i+2])*f;
  }
  dirty = true;
}
let grab = null;                               // {ids, w, orig, plane, start}
function startGrab(hitLocal, hitWorld){
  const R = brush*1.35, R2 = R*R, ids = [], w = [];
  for (let i = 0; i < NV; i++){
    const dx = P[3*i] - hitLocal.x, dy = P[3*i+1] - hitLocal.y, dz = P[3*i+2] - hitLocal.z, d2 = dx*dx + dy*dy + dz*dz;
    if (d2 < R2){ ids.push(i); w.push(falloff(d2, R2)); }
  }
  const orig = new Float32Array(ids.length*3); ids.forEach((i, k) => { orig[3*k] = P[3*i]; orig[3*k+1] = P[3*i+1]; orig[3*k+2] = P[3*i+2]; });
  const n = camera.getWorldDirection(new THREE.Vector3());
  grab = {ids, w, orig, plane:new THREE.Plane().setFromNormalAndCoplanarPoint(n, hitWorld), start:hitWorld.clone(), center:hitLocal.clone()};
}
function moveGrab(ray){
  const pt = new THREE.Vector3(); if (!ray.intersectPlane(grab.plane, pt)) return;
  const d = pt.sub(grab.start); inv.copy(lump.quaternion).invert(); d.applyQuaternion(inv);
  const L = d.length(), max = 1.6; if (L > max) d.multiplyScalar(max/L);   // clay only stretches so far
  const {ids, w, orig} = grab;
  for (let k = 0; k < ids.length; k++){ const i = ids[k], f = w[k]; P[3*i] = orig[3*k] + d.x*f; P[3*i+1] = orig[3*k+1] + d.y*f; P[3*i+2] = orig[3*k+2] + d.z*f; }
  dirty = true;
}

/* ---------- undo ---------- */
const history = [];
const snapshot = () => { history.push(Float32Array.from(P)); if (history.length > 30) history.shift(); };
function undo(){ const s = history.pop(); if (!s) return; P.set(s); dirty = true; }

/* ---------- input ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(x, y){
  ndc.set(x/innerWidth*2 - 1, -(y/innerHeight)*2 + 1); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObject(lump, false)[0]; if (!h) return null;
  inv.copy(lump.quaternion).invert();
  const local = h.point.clone().applyQuaternion(inv), n = h.face.normal.clone();
  // average normal around the hit for a smoother press
  return {world:h.point, local, n:n.normalize()};
}
let tool = 'hand', wheel = false;
let mode = null, downT = 0, downX = 0, downY = 0, lastX = 0, lastY = 0, lastMoveT = 0, pid = null;
let velX = 0, velY = 0, spin = 0;
const pointers = new Map(); let pinch0 = 0, dist0 = 0;
const ringEl = document.getElementById('ring'), armEl = ringEl.querySelector('.arm');

cv.addEventListener('pointerdown', e => {
  audioOn();
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2){                     // two fingers: pinch to zoom
    const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = camDist;
    if (grab) grab = null; mode = 'pinch'; return;
  }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){} pid = e.pointerId;
  downT = performance.now(); downX = lastX = e.clientX; downY = lastY = e.clientY;
  const h = hitAt(e.clientX, e.clientY);
  if (!h){ mode = 'rotate'; velX = velY = 0; return; }
  snapshot();
  if (e.button === 2){ mode = 'grab'; startGrab(h.local, h.world); return; }
  mode = tool === 'smooth' ? 'smooth' : wheel ? 'press' : 'armed';
  if (mode !== 'armed') apply(h, 0);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  hover(e.clientX, e.clientY);
  if (mode === 'pinch' && pointers.size === 2){ const [a, b] = [...pointers.values()]; camDist = clamp(dist0*pinch0/Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 3, 14); return; }
  if (e.pointerId !== pid || !mode) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY, now = performance.now(), dt = Math.max(1, now - lastMoveT);
  if (mode === 'armed' && Math.hypot(e.clientX - downX, e.clientY - downY) > 5) mode = 'press';
  if (mode === 'rotate'){ turn(dx, dy); velX = dx/dt*16; velY = dy/dt*16; }
  else if (mode === 'grab'){ ndc.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1); ray.setFromCamera(ndc, camera); moveGrab(ray.ray); activity = 1; }
  else if (mode === 'press' || mode === 'smooth'){
    // fill in the stroke between events so fast drags stay continuous
    const steps = Math.min(5, Math.ceil(Math.hypot(dx, dy)/10));
    const speed = Math.hypot(dx, dy)/dt;
    for (let s = 1; s <= steps; s++){ const h = hitAt(lastX + dx*s/steps, lastY + dy*s/steps); if (h) apply(h, speed); }
  }
  lastX = e.clientX; lastY = e.clientY; lastMoveT = now;
});
function end(e){
  pointers.delete(e.pointerId);
  if (mode === 'pinch'){ if (pointers.size < 2) mode = null; return; }
  if (e.pointerId !== pid) return;
  if (mode === 'grab' && grab){ relax(grab.center, brush*1.5, .35); relax(grab.center, brush*1.5, .25); grab = null; }
  if (mode === 'armed') history.pop();         // a tap that did nothing
  mode = null; pid = null; ringEl.classList.remove('grab'); armEl.style.clipPath = 'inset(0 0 100% 0)';
}
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
cv.addEventListener('pointerleave', () => ringEl.classList.remove('on'));
cv.addEventListener('wheel', e => { e.preventDefault(); camDist = clamp(camDist*Math.exp(e.deltaY*.0012), 3, 14); }, {passive:false});
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function apply(h, speed){
  if (mode === 'smooth'){ relax(h.local, brush*1.15, .5); relax(h.local, brush*1.15, .5); activity = Math.max(activity, .4); return; }
  inv.copy(lump.quaternion).invert();
  const s = brush*.11*(.35 + .65/(1 + speed*.6));   // slow strokes press deeper
  press(h.local, h.n.clone().applyQuaternion(inv), s);
  activity = Math.max(activity, .8); buzz(8);
}
function turn(dx, dy){
  const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx*.008);
  const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy*.008);
  lump.quaternion.premultiply(qy).premultiply(qx);
}
function hover(x, y){
  if (COARSE) return;
  ringEl.classList.add('on');
  const px = brush*(innerHeight/2)/Math.tan(camera.fov*Math.PI/360)/camDist;
  ringEl.style.width = ringEl.style.height = (px*2) + 'px'; ringEl.style.margin = `${-px}px 0 0 ${-px}px`;
  ringEl.style.transform = `translate(${x}px,${y}px)`;
  if (!mode) ringEl.classList.toggle('off-clay', !hitAt(x, y));
}

/* ---------- touch of feedback: buzz on phones, a soft squish in the ears ---------- */
let lastBuzz = 0;
function buzz(ms){ const n = performance.now(); if (n - lastBuzz < 70 || !navigator.vibrate) return; lastBuzz = n; try{ navigator.vibrate(ms); }catch(_){} }
let actx = null, sGain = null, sFilt = null, activity = 0, soundOn = true;
function audioOn(){
  if (actx || THUMB) return;
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate*2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < len; i++){ b = .97*b + .03*(Math.random()*2 - 1); d[i] = b*6; }   // brown-ish noise
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    sFilt = actx.createBiquadFilter(); sFilt.type = 'lowpass'; sFilt.frequency.value = 400; sFilt.Q.value = 3;
    sGain = actx.createGain(); sGain.gain.value = 0;
    src.connect(sFilt).connect(sGain).connect(actx.destination); src.start();
  }catch(_){ actx = null; }
}

/* ---------- toolbar ---------- */
const $ = id => document.getElementById(id);
$('tSmooth').onclick = () => { tool = tool === 'smooth' ? 'hand' : 'smooth'; $('tSmooth').setAttribute('aria-pressed', tool === 'smooth'); };
$('tWheel').onclick = () => { wheel = !wheel; $('tWheel').setAttribute('aria-pressed', wheel); if (wheel){ lump.quaternion.slerp(new THREE.Quaternion(), 1); } };
$('size').oninput = e => { brush = +e.target.value; };
$('undo').onclick = undo;
$('fresh').onclick = () => { snapshot(); P.set(START); dirty = true; lump.quaternion.identity(); };
$('snd').onclick = () => { soundOn = !soundOn; $('snd').setAttribute('aria-pressed', soundOn); };
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); } });
const sw = $('sw');
COLORS.forEach(([name, c, s], i) => {
  const b = document.createElement('button'); b.style.background = c; b.title = name; b.setAttribute('aria-label', name + ' clay'); b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => { targetCol.set(c); targetSheen.set(s); sw.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  sw.appendChild(b);
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(.05, clock.getDelta()), now = performance.now();
  // hold still on the clay and it grabs: then drag to pull
  if (mode === 'armed'){
    const p = (now - downT)/380;
    armEl.style.clipPath = `inset(${(1 - Math.min(1, p))*100}% 0 0 0)`;
    if (p >= 1){ const h = hitAt(lastX, lastY); if (h){ mode = 'grab'; startGrab(h.local, h.world); ringEl.classList.add('grab'); buzz(18); } else mode = null; }
  }
  if (wheel){
    lump.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), dt*(RM ? 1.2 : 2.6));
    if (mode === 'press'){ const h = hitAt(lastX, lastY); if (h){ apply(h, 0); } }       // a finger on a spinning lump turns rings
  } else if (mode !== 'rotate' && (Math.abs(velX) + Math.abs(velY)) > .01){
    turn(velX, velY); velX *= .92; velY *= .92;
  }
  if (!mode && !wheel && !RM && Math.abs(velX) + Math.abs(velY) < .02) lump.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), dt*.05);
  camera.position.set(0, camDist*.12, camDist); camera.lookAt(0, -.05, 0);
  mat.color.lerp(targetCol, .08); mat.sheenColor.lerp(targetSheen, .08);
  if (dirty){ pos.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere(); dirty = false; }
  if (sGain){ activity *= Math.exp(-dt*6); sGain.gain.setTargetAtTime(soundOn ? activity*.16 : 0, actx.currentTime, .03); sFilt.frequency.setTargetAtTime(260 + activity*700, actx.currentTime, .05); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.__lump = {P, NV};
if (THUMB){
  // sculpt a little something for the gallery picture
  camDist = 6.6; renderer.setClearColor(0xe1d7ca, 1);
  const L = (x, y, z) => new THREE.Vector3(x, y, z);
  brush = .42; snapshot();
  const pulls = [[L(0, 1, 0), L(.05, .45, .05)], [L(.8, .3, .5), L(.35, .05, .2)], [L(-.75, .25, .6), L(-.3, .02, .15)]];
  for (const [at, d] of pulls){
    const h = at.clone().normalize(); grab = null; startGrab(h, h.clone());
    const {ids, w, orig} = grab; for (let k = 0; k < ids.length; k++){ const i = ids[k], f = w[k]; P[3*i] = orig[3*k] + d.x*f; P[3*i+1] = orig[3*k+1] + d.y*f; P[3*i+2] = orig[3*k+2] + d.z*f; }
    relax(h, brush*1.5, .35);
  }
  brush = .22;
  for (let t = 0; t < 40; t++){ const a = t/40*Math.PI*2, h = L(Math.cos(a)*.98, .05 + .1*Math.sin(a*3), Math.sin(a)*.98); press(h, h.clone().normalize(), .03); }
  for (let t = 0; t < 12; t++){ const h = L(.25*Math.sin(t*.5), .4 - t*.06, .95); press(h, L(0, 0, 1), .05); }
  pos.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
  lump.rotation.set(.15, -.5, 0);
  camera.position.set(0, camDist*.12, camDist); camera.lookAt(0, -.05, 0);
  renderer.render(scene, camera);
  const o = document.createElement('pre'); o.id = 'png'; o.textContent = cv.toDataURL('image/png'); document.body.appendChild(o);
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
